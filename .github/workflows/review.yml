name: OpenAI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "Frontend/**"
      - "Backend/**"   

jobs:
  frontend-review:
    if: contains(github.event.pull_request.files[*].filename, 'Frontend/')
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run PR Review
        id: review
        uses: rajputnirmal91/openai-pr-reviewer@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ai-api-key: ${{ secrets.AI_API_KEY }}
        continue-on-error: true

      - name: Check review status
        run: |
          echo "✅ PR review workflow completed"

  backend-check:
    if: contains(github.event.pull_request.files[*].filename, 'Backend/')
    runs-on: ubuntu-latest
    steps:
      - name: Backend check passed
        run: |
          echo "✅ Backend changes - no review needed"