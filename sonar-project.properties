# ── Project identity ────────────────────────────────────────────────────────
sonar.projectKey=appraisal-system-frontend
sonar.projectName=Appraisal System – Frontend
sonar.projectVersion=0.0.0

# ── Sources ─────────────────────────────────────────────────────────────────
sonar.sources=src
sonar.exclusions=src/Mocks/**,**/*.test.tsx,**/*.test.ts,**/*.spec.tsx,**/*.spec.ts,**/node_modules/**,dist/**

# ── Test sources ────────────────────────────────────────────────────────────
sonar.tests=src
sonar.test.inclusions=**/*.test.tsx,**/*.test.ts,**/*.spec.tsx,**/*.spec.ts

# ── Language ─────────────────────────────────────────────────────────────────
sonar.language=ts

# ── Coverage ─────────────────────────────────────────────────────────────────
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ── Quality Gate ─────────────────────────────────────────────────────────────
sonar.qualitygate.wait=true

# ── Encoding ─────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
